<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redsona.live</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
  }

  .title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: rgba(255, 255, 255, 0.75);
    font-size: clamp(2rem, 6vw, 4.5rem);
    letter-spacing: 0.02em;
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
    z-index: 2;
  }
</style>
</head>
<body>

<canvas id="snow"></canvas>
<div class="title">redsona.live</div>

<script>
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const FLAKE_COUNT = 150;

  function randomFlake() {
    return {
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 2 + 1,
      speed: Math.random() * 1 + 0.3,
      drift: Math.random() * 0.6 - 0.3,
      drop: Math.random() * 2000
    };
  }

  const flakes = Array.from({ length: FLAKE_COUNT }, randomFlake);

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';

    for (const flake of flakes) {
      flake.y += flake.speed;
      flake.x += flake.drift + Math.sin((flake.y + flake.drop) / 60) * 0.3;

      if (flake.y > height) {
        flake.y = -5;
        flake.x = Math.random() * width;
      }
      if (flake.x > width) flake.x = 0;
      if (flake.x < 0) flake.x = width;

      ctx.beginPath();
      ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
